<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Call Center CRM</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #f5f7fa;
            padding: 20px;
        }

        .crm-container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .crm-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px 30px;
        }

        .crm-header h1 {
            font-size: 24px;
            font-weight: 600;
        }

        .crm-header p {
            font-size: 14px;
            opacity: 0.9;
            margin-top: 5px;
        }

        .crm-body {
            padding: 30px;
        }

        .section-title {
            font-size: 16px;
            font-weight: 600;
            color: #2d3748;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #e2e8f0;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group.full-width {
            grid-column: 1 / -1;
        }

        label {
            font-size: 14px;
            font-weight: 500;
            color: #4a5568;
            margin-bottom: 8px;
        }

        label .required {
            color: #e53e3e;
        }

        input, select, textarea {
            padding: 10px 12px;
            border: 1px solid #cbd5e0;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 80px;
            font-family: inherit;
        }

        .button-group {
            display: flex;
            gap: 12px;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #e2e8f0;
        }

        button {
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #e2e8f0;
            color: #4a5568;
        }

        .btn-secondary:hover {
            background: #cbd5e0;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }

        .status-new {
            background: #c6f6d5;
            color: #22543d;
        }

        @media (max-width: 768px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="crm-container">
        <div class="crm-header">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <div>
                    <h1>Call Center CRM</h1>
                    <p>Customer Information Management</p>
                </div>
                <div id="accountInfo" style="text-align: right; font-size: 13px; opacity: 0.9; display: none;">
                    <div><strong>Account:</strong> <span id="accountName">-</span></div>
                    <div><strong>Region:</strong> <span id="accountRegion">-</span></div>
                    <div style="font-size: 11px; margin-top: 4px;">ID: <span id="accountId">-</span></div>
                </div>
            </div>
        </div>

        <div class="crm-body">
            <form id="crmForm">
                <!-- Contact Information -->
                <h2 class="section-title">Contact Information</h2>
                <div class="form-grid">
                    <div class="form-group">
                        <label for="phone">Phone Number <span class="required">*</span></label>
                        <input type="tel" id="phone" name="phone" placeholder="+1 (555) 123-4567" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="customer@example.com">
                    </div>
                </div>

                <!-- Personal Information -->
                <h2 class="section-title">Personal Information</h2>
                <div class="form-grid">
                    <div class="form-group">
                        <label for="firstName">First Name <span class="required">*</span></label>
                        <input type="text" id="firstName" name="firstName" placeholder="John" required>
                    </div>
                    <div class="form-group">
                        <label for="lastName">Last Name <span class="required">*</span></label>
                        <input type="text" id="lastName" name="lastName" placeholder="Doe" required>
                    </div>
                    <div class="form-group">
                        <label for="company">Company</label>
                        <input type="text" id="company" name="company" placeholder="Acme Corporation">
                    </div>
                    <div class="form-group">
                        <label for="jobTitle">Job Title</label>
                        <input type="text" id="jobTitle" name="jobTitle" placeholder="Manager">
                    </div>
                </div>

                <!-- Address Information -->
                <h2 class="section-title">Address</h2>
                <div class="form-grid">
                    <div class="form-group full-width">
                        <label for="address">Street Address</label>
                        <input type="text" id="address" name="address" placeholder="123 Main Street">
                    </div>
                    <div class="form-group">
                        <label for="city">City</label>
                        <input type="text" id="city" name="city" placeholder="New York">
                    </div>
                    <div class="form-group">
                        <label for="state">State/Province</label>
                        <input type="text" id="state" name="state" placeholder="NY">
                    </div>
                    <div class="form-group">
                        <label for="zipCode">ZIP/Postal Code</label>
                        <input type="text" id="zipCode" name="zipCode" placeholder="10001">
                    </div>
                    <div class="form-group">
                        <label for="country">Country</label>
                        <select id="country" name="country">
                            <option value="">Select Country</option>
                            <option value="US" selected>United States</option>
                            <option value="CA">Canada</option>
                            <option value="MX">Mexico</option>
                            <option value="UK">United Kingdom</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                </div>

                <!-- Call Details -->
                <h2 class="section-title">Call Details</h2>
                <div class="form-grid">
                    <div class="form-group">
                        <label for="callReason">Reason for Call</label>
                        <select id="callReason" name="callReason">
                            <option value="">Select Reason</option>
                            <option value="inquiry">General Inquiry</option>
                            <option value="support">Technical Support</option>
                            <option value="sales">Sales</option>
                            <option value="billing">Billing Question</option>
                            <option value="complaint">Complaint</option>
                            <option value="followup">Follow-up</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="priority">Priority</label>
                        <select id="priority" name="priority">
                            <option value="low">Low</option>
                            <option value="medium" selected>Medium</option>
                            <option value="high">High</option>
                            <option value="urgent">Urgent</option>
                        </select>
                    </div>
                    <div class="form-group full-width">
                        <label for="notes">Call Notes</label>
                        <textarea id="notes" name="notes" placeholder="Enter call notes and customer concerns..."></textarea>
                    </div>
                </div>

                <!-- Action Buttons -->
                <div class="button-group">
                    <button type="submit" class="btn-primary">Save Contact</button>
                    <button type="button" class="btn-secondary" onclick="clearForm()">Clear Form</button>
                    <button type="button" class="btn-secondary" onclick="endCall()">End Call</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Listen for messages from Voximplant Kit
        window.addEventListener('message', function(event) {
            // Optional: Verify the origin for security
            // if (event.origin !== 'https://your-voximplant-domain.com') return;
            
            const data = event.data;
            
            console.log('Received postMessage data:', data);
            
            // Handle account_data
            if (data && data.id && data.name && data.account_region) {
                console.log('Account data received:', data);
                displayAccountInfo(data);
            }
            
            // Handle active_task_data
            if (data && data.task_type) {
                console.log('Active task data received:', data);
                handleActiveTaskData(data);
            }
        });

        // Display account information in the header
        function displayAccountInfo(accountData) {
            document.getElementById('accountId').textContent = accountData.id;
            document.getElementById('accountName').textContent = accountData.name;
            document.getElementById('accountRegion').textContent = accountData.account_region;
            document.getElementById('accountInfo').style.display = 'block';
            
            console.log('Account Info Updated:');
            console.log('- ID:', accountData.id);
            console.log('- Name:', accountData.name);
            console.log('- Region:', accountData.account_region);
        }

        // Handle active task data (CALL or IM)
        function handleActiveTaskData(taskData) {
            const taskType = taskData.task_type;
            
            if (taskType === 'CALL') {
                handleCallData(taskData);
            } else if (taskType === 'IM') {
                handleChatData(taskData);
            }
            
            // Handle customer data (common to both CALL and IM)
            if (taskData.CUSTOMER) {
                populateCustomerData(taskData.CUSTOMER);
            }
        }

        // Handle CALL type data
        function handleCallData(callData) {
            console.log('Call data received:', callData);
            
            if (callData.CALL) {
                const call = callData.CALL;
                
                // Auto-populate phone number
                if (call.phone_b) {
                    document.getElementById('phone').value = call.phone_b;
                }
                
                // Set call reason in notes if available
                const notesField = document.getElementById('notes');
                let callNotes = [];
                
                if (call.session_id) callNotes.push(`Session ID: ${call.session_id}`);
                if (call.callerid) callNotes.push(`Caller ID: ${call.callerid}`);
                if (call.record_url) callNotes.push(`Recording: ${call.record_url}`);
                
                if (callNotes.length > 0) {
                    notesField.value = callNotes.join('\n');
                }
                
                console.log('Call populated - Phone:', call.phone_b);
            }
        }

        // Handle IM (chat) type data
        function handleChatData(chatData) {
            console.log('Chat data received:', chatData);
            
            if (chatData.channel) {
                const channel = chatData.channel;
                
                // Add channel info to notes
                const notesField = document.getElementById('notes');
                let chatNotes = [];
                
                chatNotes.push(`Channel: ${channel.channel_type || 'Unknown'}`);
                if (channel.description) chatNotes.push(`Description: ${channel.description}`);
                if (chatData.conversation && chatData.conversation.uuid) {
                    chatNotes.push(`Conversation ID: ${chatData.conversation.uuid}`);
                }
                
                if (chatData.last_message && chatData.last_message.text) {
                    chatNotes.push(`Last message: ${chatData.last_message.text}`);
                }
                
                if (chatNotes.length > 0) {
                    notesField.value = chatNotes.join('\n');
                }
                
                console.log('Chat populated - Channel:', channel.channel_type);
            }
        }

        // Populate customer data into form fields
        function populateCustomerData(customer) {
            console.log('Customer data received:', customer);
            
            // Populate first name with customer_display_name
            if (customer.customer_display_name) {
                document.getElementById('firstName').value = customer.customer_display_name;
            }
            
            // Populate phone from customer_client_ids
            if (customer.customer_client_ids && customer.customer_client_ids.length > 0) {
                const clientId = customer.customer_client_ids[0].client_id;
                if (clientId) {
                    document.getElementById('phone').value = clientId;
                }
            }
            
            // Populate email from customer_emails
            if (customer.customer_emails && customer.customer_emails.length > 0) {
                document.getElementById('email').value = customer.customer_emails[0];
            }
            
            console.log('Customer info populated:', customer.customer_display_name);
        }

        // Form submission
        document.getElementById('crmForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const formData = new FormData(this);
            const data = Object.fromEntries(formData);
            
            console.log('Contact saved:', data);
            alert('Contact information saved successfully!');
        });

        // Clear form function
        function clearForm() {
            if (confirm('Are you sure you want to clear all fields?')) {
                document.getElementById('crmForm').reset();
            }
        }

        // End call function
        function endCall() {
            if (confirm('Are you sure you want to end this call?')) {
                alert('Call ended.');
                // In a real application, this would close the window or return to main screen
            }
        }

        // Auto-format phone number
        document.getElementById('phone').addEventListener('input', function(e) {
            let value = e.target.value.replace(/\D/g, '');
            if (value.length > 0) {
                if (value.length <= 3) {
                    e.target.value = value;
                } else if (value.length <= 6) {
                    e.target.value = `(${value.slice(0, 3)}) ${value.slice(3)}`;
                } else {
                    e.target.value = `(${value.slice(0, 3)}) ${value.slice(3, 6)}-${value.slice(6, 10)}`;
                }
            }
        });
    </script>
</body>
</html>
